name: OMEGA Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android toolchain using runner SDK
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Install Kotlin CLI for host regression tests
        run: |
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/omega-kotlin
          echo /tmp/omega-kotlin/kotlinc/bin >> "$GITHUB_PATH"
      - name: Host C++ tests and architecture checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/test-host.sh
          bash scripts/test-vision-host.sh
          bash scripts/test-neural-host.sh
          bash scripts/test-agents-host.sh
          bash scripts/test-world-host.sh
          bash scripts/test-reason-host.sh
          bash scripts/test-executive-host.sh
          bash scripts/test-learning-host.sh
          bash scripts/test-meta-host.sh | tee build/meta-benchmark.log
          bash scripts/test-release-host.sh | tee build/release-test.log
          python3 scripts/test-launcher-contract.py
          bash scripts/test-touch-host.sh
          bash scripts/test-tactical-host.sh
          bash scripts/test-training-host.sh
      - name: Fetch pretrained vision assets
        run: bash scripts/fetch-vision-models.sh
      - name: Android build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Verify artifact
        run: |
          mkdir -p dist
          cp build/meta-benchmark.log build/release-test.log dist/
          cp config/architecture.json docs/FASE-10.md docs/FREE-FIRE.md docs/ACCESSIBILITY.md docs/TACTICAL.md docs/RANK17.md docs/rank17-host-test.log docs/ACCESSIBILITY-UI.md docs/TRAINING-LIVE.md docs/AUTO-HUD.md docs/DIAGNOSTICS.md dist/
          cp vision/src/main/assets/models/MODEL_SHA256.txt dist/
          cp app/build/outputs/apk/debug/app-debug.apk dist/OMEGA-v1.0.8-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/OMEGA-v1.0.8-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/OMEGA-v1.0.8-debug.apk | tee dist/apk-badging.txt
          python3 scripts/verify-apk.py dist/OMEGA-v1.0.8-debug.apk dist/apk-badging.txt
          git rev-parse HEAD > dist/COMMIT.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: OMEGA-v1.0.8-debug
          path: dist/
          if-no-files-found: error
      - name: Archive exact source commit
        run: |
          mkdir -p source-dist
          git archive --format=zip --prefix=OMEGA-v1.0.8/ HEAD > source-dist/OMEGA-v1.0.8-source.zip
          (cd source-dist && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: OMEGA-v1.0.8-source
          path: source-dist/
          if-no-files-found: error
