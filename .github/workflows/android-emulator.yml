name: OMEGA Android emulator smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Fetch verified models
        run: bash scripts/fetch-vision-models.sh
      - name: Build emulator-only x86_64 APK and instrumentation
        run: gradle --no-daemon -PomegaEmulator=true :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run on virtual Android 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/test-android-emulator.sh
      - name: Upload emulator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-v1.0.18-emulator-report
          path: emulator-report/
          if-no-files-found: warn
